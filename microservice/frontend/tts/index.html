<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>朗讀測試</title>
  <style>
    :root {
      --primary: #5AB4C5;
      --primary-dark: #2F7F8E;
      --secondary: #F5BA4B;
      --gray: #738995;
      --text: #1F2A30;
      --bg: #F7FAFB;
      --card: #FFFFFF;
      --ok: #2E7D32;
      --error: #C62828;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang TC", "Noto Sans TC", Roboto, sans-serif;
      font-size: 1rem;
      line-height: 1.6;
    }
    h1 { font-size: 1.5rem; margin: 0 0 16px; }
    h2 { font-size: 1.125rem; margin: 0 0 8px; }
    section {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label { display: block; font-weight: bold; margin-bottom: 8px; }
    textarea {
      width: 100%;
      min-height: 7rem;
      padding: 12px;
      font: inherit;
      font-size: 1.125rem;
      border: 2px solid var(--gray);
      border-radius: 8px;
    }
    .row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
    button {
      min-height: 48px;
      min-width: 48px;
      padding: 0 20px;
      font: inherit;
      font-size: 1.125rem;
      font-weight: bold;
      border-radius: 8px;
      border: 2px solid var(--primary-dark);
      background: var(--card);
      color: var(--primary-dark);
      cursor: pointer;
    }
    button.primary { background: var(--primary-dark); color: #fff; }
    button:focus-visible { outline: 3px solid var(--secondary); outline-offset: 2px; }
    #status { font-size: 1.125rem; font-weight: bold; min-height: 1.6em; }
    #status.ok { color: var(--ok); }
    #status.error { color: var(--error); }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; }
    dt { font-weight: bold; }
    dd { margin: 0; word-break: break-all; }
    ul { margin: 8px 0 0; padding-left: 1.25rem; font-size: 0.875rem; }
  </style>
</head>
<body>
  <h1>朗讀測試</h1>

  <section aria-labelledby="speak-title">
    <h2 id="speak-title">念給我聽</h2>
    <div class="row">
      <button type="button" data-sample="reminder">範例：吃藥提醒</button>
      <button type="button" data-sample="card">範例：藥卡</button>
    </div>
    <label for="text" style="margin-top:12px">中文（speech_text）</label>
    <textarea id="text">陳阿嬤，吃藥時間到囉～飯後吃：1 號 脈優錠 2 顆、3 號 Metformin 500mg 半顆</textarea>
    <label for="text-en" style="margin-top:12px">English（speech_text_en）</label>
    <textarea id="text-en" lang="en">Grandma Chen, it's time for your medicine. After meals: number 1, Amlodipine 5mg, 2 tablets; number 3, Metformin 500mg, half a tablet.</textarea>
    <div class="row">
      <button type="button" class="primary" id="speak">念給我聽</button>
      <button type="button" class="primary" id="speak-en" lang="en">Read in English</button>
      <button type="button" id="stop">停止</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </section>

  <section aria-labelledby="diag-title">
    <h2 id="diag-title">環境檢查</h2>
    <dl id="diag"></dl>
    <div class="row"><button type="button" id="refresh">重新檢查</button></div>
  </section>

  <script type="module">
    import { speak, stop, diagnose } from './tts.js';

    const SAMPLES = {
      reminder: {
        zh: '陳阿嬤，吃藥時間到囉～飯後吃：1 號 脈優錠 2 顆、3 號 Metformin 500mg 半顆',
        en: "Grandma Chen, it's time for your medicine. After meals: number 1, Amlodipine 5mg, 2 tablets; number 3, Metformin 500mg, half a tablet.",
      },
      card: {
        zh: '1 號藥，脈優錠，家醫科開的，降血壓。一次 1 顆，飯後吃，早上 8 點。還剩 19 天。',
        en: 'Medicine number 1, Amlodipine 5mg, from Family Medicine, for blood pressure. Take 1 tablet after meals, at 8 AM. 19 days left.',
      },
    };
    const REASONS = {
      not_in_app: '不在 App 內',
      app_no_reply: 'App 沒有回應（App 可能是舊版，請完全停止後重新執行）',
      no_offline_voice: 'App：找不到這個語言的離線語音（請到系統設定下載該語言的語音資料）',
      no_voice_for_language: '找不到這個語言的語音',
      no_voice_list: 'App：讀不到語音清單',
      set_voice_failed: 'App：設定語音失敗',
      speak_failed: 'App：朗讀失敗',
      engine_init_timeout: 'App：語音引擎初始化逾時',
      speak_timeout: 'App：朗讀逾時',
      voice_list_timeout: 'App：讀取語音清單逾時',
      app_error: 'App：發生錯誤',
      no_web_speech: '瀏覽器不支援 speechSynthesis',
      no_chinese_voice: '找不到中文語音',
      web_speech_no_start: '已呼叫但沒有開始念（WebView 可能不支援）',
      empty_text: '沒有要念的文字',
    };
    const ENGINES = { app: 'App 內建 TTS', web: '網頁 speechSynthesis' };

    const $ = (id) => document.getElementById(id);
    const statusEl = $('status');

    function setStatus(text, kind = '') {
      statusEl.textContent = text;
      statusEl.className = kind;
    }

    function explain(reason) {
      return reason.split(',').map((r) => REASONS[r] || r).join('；');
    }

    document.querySelectorAll('[data-sample]').forEach((btn) => {
      btn.addEventListener('click', () => {
        $('text').value = SAMPLES[btn.dataset.sample].zh;
        $('text-en').value = SAMPLES[btn.dataset.sample].en;
      });
    });

    async function read(text, lang, label) {
      setStatus(`${label}朗讀中…`);
      const result = await speak(text, { lang });
      setStatus(
        result.ok ? `${label}完成（使用：${ENGINES[result.engine]}）` : `${label}無法朗讀：${explain(result.reason)}`,
        result.ok ? 'ok' : 'error',
      );
      renderDiag();
    }

    $('speak').addEventListener('click', () => read($('text').value, 'zh-TW', '中文'));
    $('speak-en').addEventListener('click', () => read($('text-en').value, 'en-US', '英文'));

    $('stop').addEventListener('click', () => { stop(); setStatus('已停止'); });
    $('refresh').addEventListener('click', renderDiag);

    async function renderDiag() {
      const d = await diagnose();
      const yesNo = (v) => (v === null ? '尚未測試（按一次「念給我聽」）' : v ? '有回應' : '上次沒有回應');
      const rows = [
        ['在 App 內', d.inApp ? '是（有 flutterObject）' : '否（一般瀏覽器）'],
        ['App 朗讀功能', d.inApp ? yesNo(d.appHandler) : '不適用'],
        ['speechSynthesis', d.webSpeech ? '支援' : '不支援'],
        ['使用的語音', d.chosenVoice ? `${d.chosenVoice.name}（${d.chosenVoice.lang}${d.chosenVoice.localService ? '，離線' : '，可能需要網路'}）` : '沒有中文語音'],
        ['語音數量', String(d.voices.length)],
        ['User-Agent', d.userAgent],
      ];
      const dl = $('diag');
      dl.replaceChildren();
      for (const [k, v] of rows) {
        const dt = document.createElement('dt'); dt.textContent = k;
        const dd = document.createElement('dd'); dd.textContent = v;
        dl.append(dt, dd);
      }
      const zh = d.voices.filter((v) => /^(zh|cmn)/i.test(v.lang));
      if (zh.length) {
        const dt = document.createElement('dt'); dt.textContent = '中文語音';
        const dd = document.createElement('dd');
        const ul = document.createElement('ul');
        for (const v of zh) {
          const li = document.createElement('li');
          li.textContent = `${v.name}（${v.lang}${v.localService ? '，離線' : ''}）`;
          ul.append(li);
        }
        dd.append(ul);
        dl.append(dt, dd);
      }
    }

    renderDiag();
  </script>
</body>
</html>
